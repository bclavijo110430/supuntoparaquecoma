services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: supuntoparaquecoma:latest
    container_name: supuntoparaquecoma
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.supuntoparaquecoma-web.entrypoints=web
      - traefik.http.routers.supuntoparaquecoma-web.rule=Host(`supuntoparaquecoma.bclavijo.xyz`)
      - traefik.http.routers.supuntoparaquecoma-web.middlewares=redirect-to-https@file
      - traefik.http.routers.supuntoparaquecoma-web.service=supuntoparaquecoma-web
      - traefik.http.routers.supuntoparaquecoma-websecure.entrypoints=websecure
      - traefik.http.routers.supuntoparaquecoma-websecure.rule=Host(`supuntoparaquecoma.bclavijo.xyz`)
      - traefik.http.routers.supuntoparaquecoma-websecure.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.supuntoparaquecoma-websecure.service=supuntoparaquecoma-websecure
      - traefik.http.services.supuntoparaquecoma-web.loadbalancer.server.port=80
      - traefik.http.services.supuntoparaquecoma-websecure.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  dokploy-network:
    external: true
